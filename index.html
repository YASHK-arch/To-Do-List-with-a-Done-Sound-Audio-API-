<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>6. To-Do List with a Done Sound (Audio API)  ~ YASH KUMAR </title>

<link rel = "stylesheet" href ="style.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amatic+SC:wght@400;700&family=Edu+NSW+ACT+Cursive:wght@400..700&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Press+Start+2P&display=swap" rel="stylesheet">
</head>

<body>

<div id="todo-container" role="application" aria-label="Todo List application">
  <h2>🎯Todo List🎯<br>⚡</br></h2>

  <div class="controls">
    <input id="task-input" type="text" placeholder="Enter task..." aria-label="Task input" />
    <button id="add-btn" aria-label="Add task">Add</button>
  </div>

  <ul id="task-list" aria-live="polite"></ul>
</div>

<script src = "script.js"></script>

</body>
</html>
